name: deploy

on:
  push:
    branches: [master]
  workflow_dispatch:
  # The homepage shows recent papers from each field's core journals, baked in
  # at build time. A weekly rebuild keeps that current without anyone pushing.
  schedule:
    - cron: "0 3 * * 1"   # Mondays, 03:00 UTC

# Required by actions/deploy-pages: it mints an OIDC token to publish.
permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race; the newer one wins.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Flips this repo's Pages source from the legacy gh-pages branch (which
      # the old Jekyll build pushed to) over to workflow publishing, in the same
      # run that produces the first artifact — so there is no window where Pages
      # expects an artifact that does not exist yet.
      - uses: actions/configure-pages@v5

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Refresh the homepage's field reading. `|| true` on purpose: Crossref
      # being slow or down must never fail a deploy — the script leaves the
      # committed data in place and the site builds with last week's papers.
      - run: node scripts/fetch-field-reading.mjs || true

      # No BASE_PATH here: this is the live site, served at the root of
      # datalab.yonsei.ac.kr. (The datalab-next preview repo sets it, because
      # it is served from a subpath.) public/CNAME carries the custom domain
      # into the export — without it GitHub Pages drops the domain on the next
      # deploy and the site falls back to infosci.github.io.
      - run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
