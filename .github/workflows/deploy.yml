name: deploy

on:
  push:
    branches: [master]
  workflow_dispatch:

# Required by actions/deploy-pages: it mints an OIDC token to publish.
permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race; the newer one wins.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Flips this repo's Pages source from the legacy gh-pages branch (which
      # the old Jekyll build pushed to) over to workflow publishing, in the same
      # run that produces the first artifact — so there is no window where Pages
      # expects an artifact that does not exist yet.
      - uses: actions/configure-pages@v5

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Fails the deploy when a paper has no Web of Science categories — an
      # unknown venue, or a conference paper missing from the per-record file.
      # Such a paper still renders in the List view and silently disappears
      # from every filter in Explore, so nothing on the site itself surfaces
      # the gap. This step is what does.
      #
      # It gates categories only. Citation Topics are legitimately absent for
      # ten papers — the Core Collection has no topic for them yet — so a
      # missing topic is not a build failure.
      - run: npm run check

      # Fails only when a paper lands on three or more homepage cards, which has
      # always meant a card's search went loose — a term naming a data source or
      # a method rather than an object of study. Papers on no card are reported
      # and allowed: a method contribution with no domain correctly has none.
      - run: npm run cards

      # next build does not run ESLint, so without this step nothing outside a
      # local terminal ever reads it. These gates sit before the build for the
      # same reason: they are the failures the site cannot show you itself.
      - run: npm run lint

      # No BASE_PATH here: this is the live site, served at the root of
      # datalab.yonsei.ac.kr. (The datalab-next preview repo sets it, because
      # it is served from a subpath.) public/CNAME carries the custom domain
      # into the export — without it GitHub Pages drops the domain on the next
      # deploy and the site falls back to infosci.github.io.
      - run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
